name: Terraform modules compliance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/terraform_modules_compliance.yaml"

jobs:
  terraform-compliance:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_compliance.yaml@e5882944df3a6de42cc9f7f856c1d8c0e7b2af32  # main
    with:
      terraform-directories: '["terraform/charm"]'
