name: Update Terraform documentation

# Keep the `paths` filters below and the `terraform-directory` input in sync with
# the directories where the Terraform modules live.
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/generate_terraform_docs.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/generate_terraform_docs.yaml"

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform-docs:
    name: Update Terraform documentation
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@e5882944df3a6de42cc9f7f856c1d8c0e7b2af32  # main
    secrets: inherit
    with:
      terraform-directory: terraform/charm
