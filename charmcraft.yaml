name: jenkins-agent

type: charm

title: Jenkins agent
summary: Jenkins agent machine charm
description: |
  A [Juju](https://juju.is/) [charm](https://juju.is/docs/olm/charmed-operators)
  deploying and managing [Jenkins](https://www.jenkins.io/) Agent on machines and
  configurable to use a Jenkins charm deployed in another Juju model.

  This charm simplifies initial deployment and "day N" operations of Jenkins Agent
  on VMs and bare metal.

  As such, the charm makes it easy for those looking to take control of their own
  Agents whilst keeping operations simple, and gives them the freedom to deploy on
  the platform of their choice.

  For DevOps or SRE teams this charm will make operating Jenkins Agent simple and
  straightforward through Juju's clean interface. It will allow easy deployment
  into multiple environments for testing changes, and supports scaling out for
  enterprise deployments.
links:
  contact: https://launchpad.net/~canonical-is-devops
  documentation: https://discourse.charmhub.io/t/jenkins-agent-documentation-overview/12694
  issues: https://github.com/canonical/jenkins-agent-operator/issues
  source: https://github.com/canonical/jenkins-agent-operator
  website: https://charmhub.io/jenkins-agent

parts:
  charm:
    source: .
    plugin: uv
    build-snaps:
    - astral-uv
  templates:
    plugin: dump
    source: ./templates
    source-type: local
    organize:
      "*": "templates/"

actions:
  migrate-runtime-directory:
    description: >
      Recursively update ownership and owner permissions for a Jenkins directory.
      The target user is the configured agent_user and the directory defaults to
      jenkins_home. The action requires the agent service to be stopped.
    params:
      directory:
        type: string
        default: ""
        description: >
          Existing directory under the configured jenkins_home to migrate. Leave empty
          to migrate the complete configured Jenkins home.
    additionalProperties: false

platforms:
  ubuntu@24.04:amd64:
  ubuntu@22.04:amd64:
  ubuntu@24.04:arm64:
  ubuntu@22.04:arm64:
  ubuntu@24.04:s390x:
  ubuntu@22.04:s390x:
  ubuntu@24.04:ppc64el:
  ubuntu@22.04:ppc64el:

config:
  options:
    jenkins_agent_labels:
      type: string
      default: ""
      description: |
        Comma-separated list of labels to be assigned to the agent in Jenkins. If not set it will
        default to the agents hardware identifier, e.g.: 'x86_64'
    agent_user:
      type: string
      default: jenkins
      description: |
        OS user that runs the Jenkins agent systemd service. Defaults to jenkins.
        The charm ensures the user exists, owns JENKINS_HOME, and is granted
        passwordless sudo. Note that the systemd unit file itself is always owned
        by root.
    jenkins_home:
      type: string
      default: ""
      description: |
        Home directory for the Jenkins agent, passed to the agent as -workDir and
        used as the working directory by the systemd service. If unset, the agent
        uses /var/lib/jenkins locally and does not manage the Jenkins node remoteFS.
    websocket_mode:
      type: boolean
      default: true
      description: |
        Enable WebSocket mode for agent connection. When enabled, the agent connects to Jenkins
        over HTTP/HTTPS using WebSocket protocol instead of requiring direct TCP access to port
        50000. This is required when using HTTP-only ingress (e.g., traefik-k8s) and is the
        recommended mode for most deployments. Disable only if Jenkins server has direct TCP port
        50000 accessibility and you need JNLP4 protocol instead of WebSocket.

provides:
  agent:
    interface: jenkins_agent_v0
